  function cerrarModalMover() {
    document.getElementById("moverFotoModal").style.display = "none";
  }

  async function confirmarAccionModalMover(forzarSustitucion) {
    const provDest = contextoMover.provinciaSel;
    const pueDest = contextoMover.puebloSel;
    const numNodo = Math.max(1, Number(document.getElementById("inputNodoMover").value || 1));
    const tipo = document.getElementById("selTipoNuevoModal").value;
    const numCaja = Math.max(1, Number(document.getElementById("inputNumElementoModal").value || 1));
    const codDest = construirCodigoYTitulo(tipo, numNodo, numCaja, pueDest).codigo;
    const vistaDest = document.getElementById("selMoverVista").value;

    const btn = document.getElementById("btnConfirmarMover");
    btn.innerText = "Moviendo...";
    btn.disabled = true;

    try {
      const resp = await fetch(obtenerEndpoint(), {
        method: "POST",
        redirect: "follow",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({
          action: "gestionarFotoRed",
          subAction: "mover",
          fileId: contextoMover.fileId,
          provinciaDestino: provDest,
          puebloDestino: pueDest,
          codigoDestino: codDest,
          vistaDestino: vistaDest,
          forzarSustitucion: Boolean(forzarSustitucion)
        })
      });
      const res = await resp.json();
      if (res.error) throw new Error(res.error);

      if (res.colision && res.fotoExistente) {
        document.getElementById("cajaColisionMover").style.display = "block";
        document.getElementById("textoColisionMover").innerText = res.mensaje;
        document.getElementById("imgColisionMover").src = res.fotoExistente.base64;
        document.getElementById("linkDriveColision").href = res.fotoExistente.url;
        btn.innerText = "Sustituir foto";
        btn.disabled = false;
        btn.onclick = () => confirmarAccionModalMover(true);
        return;
      }

      cerrarModalMover();
      await cargarMapaMentalPueblo(true);
    } catch (e) {
      alert("Error al mover: " + e.message);
    } finally {
      btn.disabled = false;
    }
  }

  async function eliminarFotoDeDrive(fileId) {
    cerrarFlotantes();
    if (!confirm("¿Eliminar esta fotografía de Google Drive?")) return;
    const { provincia, pueblo } = seleccionPuebloEstado;
    try {
      await fetch(obtenerEndpoint(), {
        method: "POST",
        redirect: "follow",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({
          action: "gestionarFotoRed",
          subAction: "eliminar",
          fileId,
          provinciaOrigen: provincia,
          puebloOrigen: pueblo
        })
      });
      await cargarMapaMentalPueblo(true);
    } catch (e) {}
  }

  // Ir a completar un elemento desde el Mapa Mental marcando en verde las vistas que ya están en Drive
  function irACompletarCaja(codigo) {
    const { provincia, pueblo } = seleccionPuebloEstado;
    const desc = descomponerCodigoEnRuleta(codigo);
    if (!desc) return;

    const infoTit = construirCodigoYTitulo(desc.tipo, desc.numNodo, desc.numCaja, pueblo);
    const elEnMapa = (datosMapaMentalActual && datosMapaMentalActual.elementos && datosMapaMentalActual.elementos[codigo]) || {};
    const vistasYaEnDrive = elEnMapa.vistas || {};

    modoCompletando = {
      codigo: infoTit.codigo,
      titulo: infoTit.titulo,
      tipo: desc.tipo,
      numNodo: desc.numNodo,
      numCaja: desc.numCaja,
      vistasEnDrive: vistasYaEnDrive
    };

    elementoDesplegadoMapa = null;
    cambiarTab("rafaga");

    const nuevoId = "b_" + Date.now();
    bloquesCajas = [{
      id: nuevoId,
      provincia: provincia || "Murcia",
      pueblo: pueblo || "Águilas",
      tipo: desc.tipo,
      numNodo: desc.numNodo,
      numCaja: desc.numCaja,
      fijadoManualmente: true,
      fotos: []
    }];
    ruletaAbiertaId = null;

    document.getElementById("tituloGrandeCompletando").innerText = `Completando ${infoTit.titulo}`;
    document.getElementById("bannerCompletandoCaja").style.display = "flex";
    renderTarjetas();
  }
</script>
